{% extends "base.html" %}
{% load static %}
{% block title %}Staff Login - {{ site.company_name }}{% endblock %}

{% block extra_css %}
<style>
  .login-wrap { min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 60px 20px; }
  .login-container {
    background: #fff; padding: 40px; border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,.08);
    width: 100%; max-width: 400px; text-align: center;
    border: 1px solid var(--wm-line);
  }
  .login-icon {
    width: 72px; height: 72px; margin: 0 auto 24px;
    background: linear-gradient(135deg, var(--wm-green), var(--wm-green-light));
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .login-icon svg { width: 34px; height: 34px; stroke: #fff; stroke-width: 2; }
  .login-title { font-size: 2rem; color: var(--wm-ink); margin-bottom: 28px; }
  .form-group { margin-bottom: 20px; text-align: left; }
  .form-group label { display: block; margin-bottom: 6px; color: #555; font-weight: 500; font-size: 14px; }
  .input-wrapper { position: relative; }
  .input-wrapper input {
    width: 100%; padding: 14px 44px 14px 14px; border: 1px solid var(--wm-line);
    border-radius: 10px; font-size: 16px; background: var(--wm-surface-2); box-sizing: border-box;
  }
  .input-wrapper input:focus { outline: none; border-color: var(--wm-green-light); background: #fff; box-shadow: 0 0 0 3px rgba(64,145,108,.15); }
  .input-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #999; }
  .login-btn {
    width: 100%; background: var(--wm-green); color: #fff; padding: 14px; border: 0;
    border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin: 6px 0 20px;
  }
  .login-btn:hover { background: var(--wm-green-dark); }
  .back-home { color: var(--wm-green); text-decoration: none; font-weight: 500; font-size: 14px; }
  .error-message { background: #fdecec; color: #8a1c1c; padding: 12px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; }
</style>
{% endblock %}

{% block content %}
<div class="login-wrap">
  <div class="login-container" data-aos="zoom-in" data-aos-duration="600">
    <div class="login-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
    <h1 class="login-title">Staff Login</h1>

    {% if error %}<div class="error-message">{{ error }}</div>{% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Username or Email</label>
        <div class="input-wrapper">
          <input type="text" id="username" name="username" required placeholder="Enter your username or email">
          <div class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" required placeholder="Password">
          <div class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><circle cx="12" cy="16" r="1"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
        </div>
      </div>
      <button type="submit" class="login-btn">Sign in</button>
    </form>

    <a href="{% url 'index' %}" class="back-home">&larr; Back to Home</a>
  </div>
</div>
{% endblock %}
